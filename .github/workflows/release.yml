name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Benchmark & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Package
        run: mvn -B clean package -DskipTests

      - name: Run JMH Benchmarks (with GC Profiling)
        run: |
          java -jar ariadne-benchmarks/target/benchmarks.jar \
            -rf json \
            -rff benchmark-results.json \
            -prof gc \
            -wi 5 -w 1s -i 5 -r 1s -f 3

      - name: Generate Benchmark Summary Table
        run: |
          python3 scripts/generate_benchmark_tables.py benchmark-results.json --format md > benchmark-table.md
          cat benchmark-table.md >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: benchmark-table.md
          files: |
            ariadne-agent/target/ariadne-agent-*.jar
            ariadne-core/target/ariadne-core-*.jar
            ariadne-adapter-reactor/target/ariadne-adapter-reactor-*.jar
            ariadne-adapter-rxjava/target/ariadne-adapter-rxjava-*.jar
            ariadne-adapter-mdc/target/ariadne-adapter-mdc-*.jar
            ariadne-benchmarks/target/benchmarks.jar
            benchmark-results.json
            scripts/generate_benchmark_tables.py
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
