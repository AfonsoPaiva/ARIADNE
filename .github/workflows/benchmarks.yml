name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      warmup_iterations:
        description: 'Warmup Iterations (per benchmark)'
        required: false
        default: '5'
      measurement_iterations:
        description: 'Measurement Iterations'
        required: false
        default: '5'
      forks:
        description: 'JVM Forks'
        required: false
        default: '3'
  pull_request:
    paths:
      - 'ariadne-core/**'
      - 'ariadne-agent/**'
      - 'ariadne-benchmarks/**'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run JMH Microbenchmarks & Compare vs Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Benchmarks JAR (Current Branch)
        run: mvn -B clean package -DskipTests -pl ariadne-benchmarks -am

      - name: Execute JMH Benchmarks (Current Branch)
        run: |
          java -jar ariadne-benchmarks/target/benchmarks.jar \
            -rf json \
            -rff benchmark-results.json \
            -prof gc \
            -wi ${{ github.event.inputs.warmup_iterations || '5' }} -w 1s \
            -i ${{ github.event.inputs.measurement_iterations || '5' }} -r 1s \
            -f ${{ github.event.inputs.forks || '3' }}

      - name: Attempt Baseline Retrieval from main
        id: main_baseline
        run: |
          git checkout origin/main || git checkout main || true
          if [ -f "benchmark-results.json" ]; then
            cp benchmark-results.json benchmark-baseline-main.json
            echo "has_baseline=true" >> $GITHUB_OUTPUT
          else
            echo "Building main baseline..."
            mvn -B clean package -DskipTests -pl ariadne-benchmarks -am || true
            if [ -f "ariadne-benchmarks/target/benchmarks.jar" ]; then
              java -jar ariadne-benchmarks/target/benchmarks.jar \
                -rf json \
                -rff benchmark-baseline-main.json \
                -prof gc \
                -wi 2 -w 1s -i 2 -r 1s -f 1 || true
              echo "has_baseline=true" >> $GITHUB_OUTPUT
            fi
          fi
          # Return to current checkout
          git checkout - || true

      - name: Generate Benchmark Comparison Report vs Main
        if: always()
        run: |
          python3 scripts/compare_benchmarks.py benchmark-results.json benchmark-baseline-main.json >> $GITHUB_STEP_SUMMARY || \
          python3 scripts/generate_benchmark_tables.py benchmark-results.json --format md >> $GITHUB_STEP_SUMMARY

      - name: Upload Raw Results Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmh-benchmark-results
          path: |
            benchmark-results.json
            benchmark-baseline-main.json
