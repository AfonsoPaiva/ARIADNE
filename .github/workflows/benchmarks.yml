name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      warmup_iterations:
        description: 'Warmup Iterations (per benchmark)'
        required: false
        default: '2'
      measurement_iterations:
        description: 'Measurement Iterations'
        required: false
        default: '3'
      forks:
        description: 'JVM Forks'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run JMH Microbenchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Benchmarks JAR
        run: mvn -B clean package -DskipTests -pl ariadne-benchmarks -am

      - name: Execute JMH Benchmarks
        run: |
          java -jar ariadne-benchmarks/target/benchmarks.jar \
            -rf json \
            -rff benchmark-results.json \
            -prof gc \
            -wi ${{ github.event.inputs.warmup_iterations || '2' }} -w 1s \
            -i ${{ github.event.inputs.measurement_iterations || '3' }} -r 1s \
            -f ${{ github.event.inputs.forks || '1' }}

      - name: Publish Benchmark Step Summary
        if: always()
        run: |
          python3 scripts/format_benchmark_summary.py benchmark-results.json >> $GITHUB_STEP_SUMMARY

      - name: Upload Raw Results JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmh-benchmark-results
          path: benchmark-results.json
